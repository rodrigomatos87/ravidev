version: '3.8'

services:
  # ====================
  # Nginx Web Server
  # ====================
  nginx:
    image: nginx:alpine
    container_name: ravi-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../public:/var/www/html/public:ro
      - ../storage/logs/nginx:/var/log/nginx
    depends_on:
      - php
    networks:
      - ravi-network

  # ====================
  # PHP-FPM Application
  # ====================
  php:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: ravi-php
    restart: unless-stopped
    volumes:
      - ../:/var/www/html
      - ./php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - APP_ENV=${APP_ENV:-development}
      - APP_DEBUG=${APP_DEBUG:-true}
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-ravi_developer}
      - DB_USERNAME=${DB_USERNAME:-ravi}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - ravi-network

  # ====================
  # WebSocket Server
  # ====================
  websocket:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: ravi-websocket
    restart: unless-stopped
    command: php /var/www/html/bin/websocket-server.php
    ports:
      - "${WEBSOCKET_PORT:-8081}:8081"
    volumes:
      - ../:/var/www/html
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-ravi_developer}
      - DB_USERNAME=${DB_USERNAME:-ravi}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - WEBSOCKET_HOST=0.0.0.0
      - WEBSOCKET_PORT=8081
    depends_on:
      php:
        condition: service_started
      mariadb:
        condition: service_healthy
    networks:
      - ravi-network

  # ====================
  # MariaDB (banco oficial: MariaDB 10.6+; as migrations usam sintaxe exclusiva do MariaDB)
  # O schema NÃO é carregado pelo docker-entrypoint-initdb.d: quem aplica é o bin/db-init.php,
  # que registra cada migration em schema_migrations e inclui as dos módulos (modulos/*/migrations).
  # Depois do primeiro `make up`: `make db-init` e `make criar-admin`.
  # ====================
  mariadb:
    image: mariadb:10.11
    container_name: ravi-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MARIADB_DATABASE: ${DB_DATABASE:-ravi_developer}
      MARIADB_USER: ${DB_USERNAME:-ravi}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mariadb-data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ravi-network

  # ====================
  # Sandbox Container Manager
  # ====================
  # Note: The sandbox containers are managed dynamically by the application
  # This service builds the sandbox image for use
  sandbox-builder:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: ravi-sandbox:latest
    container_name: ravi-sandbox-builder
    command: echo "Sandbox image built successfully"
    profiles:
      - build

  # ====================
  # phpMyAdmin (Development)
  # ====================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ravi-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      UPLOAD_LIMIT: 100M
    ports:
      - "${PHPMYADMIN_PORT:-8082}:80"
    depends_on:
      - mariadb
    profiles:
      - dev
    networks:
      - ravi-network

  # ====================
  # Mailhog (Development - Email Testing)
  # ====================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: ravi-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    profiles:
      - dev
    networks:
      - ravi-network

# ====================
# Volumes
# ====================
volumes:
  mariadb-data:
    driver: local

# ====================
# Networks
# ====================
networks:
  ravi-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

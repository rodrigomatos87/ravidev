; Ravi Developer - PHP Configuration
; Optimized for development and production use

[PHP]
; Error handling
display_errors = ${PHP_DISPLAY_ERRORS:-Off}
display_startup_errors = Off
log_errors = On
error_log = /var/log/php/error.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Memory and execution
memory_limit = 256M
max_execution_time = 300
max_input_time = 300

; File uploads
file_uploads = On
upload_max_filesize = 100M
post_max_size = 100M
max_file_uploads = 20

; Session
session.save_handler = files
session.save_path = /var/www/html/storage/sessions
session.gc_maxlifetime = 7200
session.cookie_httponly = On
session.cookie_secure = Off
session.cookie_samesite = Lax
session.use_strict_mode = On

; Timezone
date.timezone = America/Sao_Paulo

; Charset
default_charset = UTF-8
mbstring.internal_encoding = UTF-8

; Realpath cache
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; OPcache
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE:-1}
opcache.save_comments = 1
opcache.fast_shutdown = 1

; cURL
curl.cainfo = /etc/ssl/certs/ca-certificates.crt

; OpenSSL
openssl.cafile = /etc/ssl/certs/ca-certificates.crt

[MySQLi]
mysqli.reconnect = On
mysqli.default_socket = /var/run/mysqld/mysqld.sock

[Pdo_mysql]
pdo_mysql.default_socket = /var/run/mysqld/mysqld.sock

[Date]
date.timezone = America/Sao_Paulo

[Sodium]
; Enabled by default

[Redis]
; Configured via application
